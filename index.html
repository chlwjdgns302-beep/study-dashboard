역학 자료(2013)","url":"https://contents.kocw.net/KOCW/document/2013/hanyang/Nosamyoung/3.pdf","note":"본문 확인; 힘과 응력","checked":"2026-11-18"},{"id":"column","title":"서원대 압축부재 자료(2014)","url":"https://contents.kocw.net/KOCW/document/2014/Seowon/Leehongwoo/10.pdf","note":"본문 확인; 이상적인 탄성좌굴만 사용","checked":"2026-11-18"},{"id":"heat","title":"한양대 공기조화 열관류 자료(2015)","url":"https://contents.kocw.net/KOCW/document/2015/hanyang/leejaeheon/07.pdf","note":"본문 확인; 열저항 원리","checked":"2026-11-18"},{"id":"drain","title":"부산대 건축설비 배수 자료(2016)","url":"https://contents.kocw.net/KOCW/document/2016/pusan/yoonseonghwan/4.pdf","note":"본문 확인; 트랩·통기 원리","checked":"2026-11-18"},{"id":"env","title":"부산대 건축설비 개요(2016)","url":"https://contents.kocw.net/KOCW/document/2016/pusan/yoonseonghwan/1.pdf","note":"본문 확인; 건축과 설비 통합","checked":"2026-11-18"},{"id":"ohm","title":"OpenStax 옴의 법칙","url":"https://openstax.org/books/university-physics-volume-2/pages/9-4-ohms-law","note":"본문 확인; 옴성 저항 조건","checked":"2026-11-18"},{"id":"power","title":"OpenStax 전기에너지와 전력","url":"https://openstax.org/books/university-physics-volume-2/pages/9-5-electrical-energy-and-power","note":"본문 확인; 직류 전력","checked":"2026-11-18"},{"id":"fire","title":"소방청 어린이 소방교육 퀴즈","url":"https://119metaverse.nfa.go.kr/occasion/kids-quiz/quiz-test","note":"교육자료 확인; 연소 기본요소만 사용","checked":"2026-11-18"}],"lessons":[{"id":"brief","scopeId":"scope0","title":"설계는 요구조건을 정리하는 일","sourceIds":["plan"],"minutes":7,"core":"공간을 그리기 전에 사용자·활동·대지·예산의 조건을 정리합니다.","explain":"사무실 계획이라면 인원, 회의 방식, 방문객 이동을 먼저 파악합니다. 요구 조사 → 관계 분석 → 공간 대안 → 검토의 흐름으로 생각하세요.","contrast":"예쁜 형태를 먼저 정하는 것과 요구에 근거해 대안을 비교하는 것은 다릅니다.","prerequisites":[],"questions":[{"id":"brief-0","prompt":"배치 전에 우선 확인할 것은?","choices":["사용 인원과 활동","외벽 색상만","가구 상표만"],"answer":0,"explanation":"필요한 공간과 관계를 결정할 조건부터 조사합니다."},{"id":"brief-1","prompt":"방문객과 직원 동선이 계속 충돌합니다. 먼저 할 일은?","choices":["복도 색 변경","이동 경로와 이용 시간 분석","창문 크기만 변경"],"answer":1,"explanation":"누가 언제 어디로 이동하는지 파악해야 대안을 만들 수 있습니다."}]},{"id":"coverage","scopeId":"scope1","title":"건폐율과 용적률","sourceIds":["law"],"minutes":7,"core":"건폐율은 대지 위 점유 비율, 용적률은 산정 대상 연면적의 비율입니다.","explain":"건폐율 = 건축면적 ÷ 대지면적 ×100. 용적률 = 용적률 산정용 연면적 ÷ 대지면적 ×100. 면적은 같은 단위로 맞춥니다.","contrast":"법정 상한과 연면적 제외 항목은 별도 확인 대상입니다. 아래에서는 산정용 면적을 조건으로 줍니다.","prerequisites":[],"questions":[{"id":"coverage-0","prompt":"대지 500㎡, 건축면적 200㎡의 건폐율은?","choices":["25%","40%","250%"],"answer":1,"explanation":"200÷500×100=40%."},{"id":"coverage-1","prompt":"대지 400㎡, 용적률 산정용 연면적 800㎡이면?","choices":["50%","100%","200%"],"answer":2,"explanation":"800÷400×100=200%."}]},{"id":"spec","scopeId":"scope2","title":"도면과 시방서의 역할","sourceIds":["build"],"minutes":7,"core":"도면의 형상·치수 정보와 시방서의 재료·시공 요구를 함께 읽습니다.","explain":"시방서는 도면만으로 전달하기 어려운 품질과 작업 조건 등을 글로 정리합니다. 서로 맞지 않으면 임의로 선택하지 말고 계약문서와 질의 절차를 확인합니다.","contrast":"도면에 없는 내용이 모두 자유 시공이라는 뜻은 아닙니다.","prerequisites":[],"questions":[{"id":"spec-0","prompt":"재료의 품질 요구를 추가로 확인할 문서는?","choices":["출근부","시방서","식단표"],"answer":1,"explanation":"시방서에 재료와 시공의 요구조건이 기록됩니다."},{"id":"spec-1","prompt":"도면과 시방서 내용이 충돌하면?","choices":["편한 쪽 선택","무조건 도면만 적용","문서 기준 확인 후 질의"],"answer":2,"explanation":"문서의 계약상 관계와 승인 절차를 확인합니다."}]},{"id":"quantity","scopeId":"scope5","title":"적산과 견적","sourceIds":["build"],"minutes":7,"core":"적산은 필요한 수량을, 견적은 비용을 구하는 데 초점을 둡니다.","explain":"직육면체 콘크리트의 기본 체적은 길이×폭×높이입니다. 길이 단위를 m로 맞추면 체적은 m³입니다. 아래는 공제·할증 없는 순체적입니다.","contrast":"m²는 면적, m³는 체적입니다. 실제 내역 산출 규칙은 별도입니다.","prerequisites":[],"questions":[{"id":"quantity-0","prompt":"2m×3m×0.2m 슬래브의 순체적은?","choices":["1.2m³","6m³","12m³"],"answer":0,"explanation":"2×3×0.2=1.2m³."},{"id":"quantity-1","prompt":"수량 4m³, 단가 10만원/m³의 재료비는?","choices":["14만원","40만원","2.5만원"],"answer":1,"explanation":"수량×단가=40만원입니다."}]},{"id":"cpm","scopeId":"scope4","title":"주공정과 전체 공기","sourceIds":["cpm"],"minutes":7,"core":"주공정은 선후관계에 따른 경로 중 총 소요시간이 가장 긴 경로입니다.","explain":"동시에 가능한 경로도 모두 끝나야 준공할 수 있습니다. 자원제약과 달력효과를 제외한 기본 CPM에서는 가장 긴 경로가 전체 기간을 결정합니다.","contrast":"가장 짧은 경로가 아닙니다. 주공정이 여러 개일 수도 있습니다.","prerequisites":[],"questions":[{"id":"cpm-0","prompt":"동시 시작 경로 A→B=3+5일, C→D=4+2일. 총 공기는?","choices":["6일","14일","8일"],"answer":2,"explanation":"두 경로 중 긴 8일이 완료 시점을 결정합니다."},{"id":"cpm-1","prompt":"두 경로가 각각 8일, 6일입니다. 짧은 경로를 1일 줄이면?","choices":["전체도 1일 단축","전체 8일 유지","전체 7일"],"answer":1,"explanation":"가장 긴 경로가 변하지 않습니다."}]},{"id":"ground","scopeId":"scope6","title":"지반조사와 기초 판단","sourceIds":["build"],"minutes":7,"core":"지층과 지하수 등 지반 조건을 확인한 뒤 기초와 굴착 계획을 검토합니다.","explain":"겉보기 땅 상태만으로 깊은 지층을 알 수 없습니다. 조사보고서는 지층 분포와 시험 결과를 함께 읽어야 합니다.","contrast":"한 지점의 시험값을 부지 전체의 동일한 성질로 단정하지 않습니다.","prerequisites":[],"questions":[{"id":"ground-0","prompt":"굴착 전 지하수와 지층을 확인할 자료는?","choices":["지반조사보고서","가구배치도","도장색 견본"],"answer":0,"explanation":"지반과 지하수 조건이 굴착 및 기초 검토의 입력입니다."},{"id":"ground-1","prompt":"한 조사점이 단단하면 모든 위치의 기초를 동일하게 결정해도 될까요?","choices":["항상 가능","면적만 같으면 가능","분포와 추가 조건 검토 필요"],"answer":2,"explanation":"지층은 위치와 깊이에 따라 달라집니다."}]},{"id":"balance27","scopeId":"scope11","title":"힘과 모멘트의 평형","sourceIds":["statics"],"minutes":7,"core":"정지한 평면 구조물은 수평력·수직력·모멘트의 합이 각각 0입니다.","explain":"힘의 합은 이동, 모멘트의 합은 회전을 점검합니다. 위로 받치는 힘의 합이 아래 하중과 같아도 회전 평형은 따로 확인해야 합니다.","contrast":"힘만 평형이라고 전체 평형이 보장되지 않습니다.","prerequisites":[],"questions":[{"id":"balance27-0","prompt":"아래 하중 12kN, 왼쪽 반력 8kN이면 오른쪽 반력은?","choices":["20kN","4kN","8kN"],"answer":1,"explanation":"수직 평형에서 12−8=4kN입니다."},{"id":"balance27-1","prompt":"크기 같은 반대 힘이 서로 다른 작용선에 있으면?","choices":["회전 효과가 생길 수 있다","항상 완전 평형","모멘트는 반드시 0"],"answer":0,"explanation":"힘 합이 0이어도 우력의 회전 효과가 남을 수 있습니다."}]},{"id":"moment27","scopeId":"scope11","title":"모멘트의 수직거리","sourceIds":["statics"],"minutes":7,"core":"모멘트의 크기는 힘×기준점에서 작용선까지의 수직거리입니다.","explain":"M=F×d. F가 kN, d가 m이면 M은 kN·m입니다. 거리에는 힘의 방향에 수직인 길이를 사용합니다.","contrast":"막대 길이를 무조건 곱하지 않습니다. 기준점이 힘의 작용선 위라면 거리가 0입니다.","prerequisites":[],"questions":[{"id":"moment27-0","prompt":"힘 4kN, 수직거리 0.5m의 모멘트 크기는?","choices":["8kN·m","2kN·m","4.5kN·m"],"answer":1,"explanation":"4×0.5=2kN·m입니다."},{"id":"moment27-1","prompt":"힘의 작용선이 기준점을 지나면 그 힘의 모멘트는?","choices":["힘과 같다","무한대","0"],"answer":2,"explanation":"수직거리가 0이므로 F×0=0입니다."}]},{"id":"reaction27","scopeId":"scope11","title":"단순보의 지점반력","sourceIds":["beam"],"minutes":7,"core":"단순보의 한 집중하중은 반대쪽 거리에 비례해 각 지점에 분배됩니다.","explain":"A에서 하중까지 a, 하중에서 B까지 b, L=a+b일 때 VA=P×b/L, VB=P×a/L. 보의 자중과 다른 하중은 없는 조건입니다.","contrast":"왼쪽 반력에 왼쪽 거리 a를 넣으면 반대 지점의 반력을 계산하게 됩니다.","prerequisites":["balance27","moment27"],"questions":[{"id":"reaction27-0","prompt":"P=12kN, a=2m, b=4m이면 VA는?","choices":["4kN","8kN","12kN"],"answer":1,"explanation":"B점 모멘트 평형: VA×6=12×4, VA=8kN."},{"id":"reaction27-1","prompt":"같은 보에서 하중을 A에 더 가까이 이동하면?","choices":["VA 증가","VA 감소","항상 반반"],"answer":0,"explanation":"A가 더 많은 하중을 받으며 두 반력의 합은 P입니다."}]},{"id":"section","scopeId":"scope11","title":"반력과 단면력","sourceIds":["beam"],"minutes":7,"core":"반력은 지점의 외부 작용, 단면력은 가상으로 자른 내부 단면의 작용입니다.","explain":"전체 보의 반력을 구한 뒤 필요한 위치를 자르고 한쪽 부분의 평형을 세웁니다. 축력은 축 방향, 전단력은 횡 방향, 휨모멘트는 휘게 하는 작용입니다.","contrast":"잘라낸 반대쪽의 작용을 단면력으로 대신 표시해야 합니다.","prerequisites":["balance27"],"questions":[{"id":"section-0","prompt":"내부 전단력을 구할 때 필요한 과정은?","choices":["외부 하중 모두 삭제","관심 위치 절단 후 평형","단면적만 계산"],"answer":1,"explanation":"절단한 부분에 외력과 단면력을 표시합니다."},{"id":"section-1","prompt":"보를 휘게 하는 내부 작용은?","choices":["휨모멘트","전기저항","열관류율"],"answer":0,"explanation":"휨모멘트는 휨 변형과 관련됩니다."}]},{"id":"stress27","scopeId":"scope11","title":"응력과 힘의 구분","sourceIds":["stress"],"minutes":7,"core":"평균 축응력은 축력을 단면적으로 나눈 값입니다.","explain":"σ=N/A. N은 축력(N), A는 단면적(mm²)이면 σ는 N/mm²=MPa입니다. 중심축 하중과 균일 응력으로 단순화한 조건입니다.","contrast":"힘이 같아도 면적이 작으면 응력은 커집니다. 힘 kN과 응력 MPa를 혼동하지 마세요.","prerequisites":[],"questions":[{"id":"stress27-0","prompt":"축력 10000N, 면적 1000mm²의 평균 응력은?","choices":["10MPa","100MPa","0.1MPa"],"answer":0,"explanation":"10000÷1000=10N/mm²입니다."},{"id":"stress27-1","prompt":"힘은 일정하고 면적을 2배로 하면 응력은?","choices":["2배","같음","1/2배"],"answer":2,"explanation":"응력은 면적에 반비례합니다."}]},{"id":"strain27","scopeId":"scope11","title":"변형량과 변형률","sourceIds":["stress"],"minutes":7,"core":"변형률은 길이 변화량을 원래 길이로 나눈 비율입니다.","explain":"ε=ΔL/L. 두 길이는 같은 단위로 맞춥니다. 1000mm 봉이 1mm 늘어나면 ε=0.001입니다.","contrast":"1mm라는 변형량과 0.001이라는 무차원 변형률은 다릅니다.","prerequisites":[],"questions":[{"id":"strain27-0","prompt":"길이 2000mm, 늘어난 길이 2mm의 변형률은?","choices":["1000","0.001","2mm"],"answer":1,"explanation":"2÷2000=0.001이며 단위가 상쇄됩니다."},{"id":"strain27-1","prompt":"동일하게 1mm 늘어난 1m 봉과 2m 봉 중 변형률이 큰 것은?","choices":["1m 봉","2m 봉","동일"],"answer":0,"explanation":"원래 길이가 짧은 봉의 상대적인 변화가 큽니다."}]},{"id":"buckling","scopeId":"scope15","title":"압축부재와 좌굴","sourceIds":["column"],"minutes":7,"core":"가늘고 긴 압축부재는 재료가 눌려 파괴되기 전에 옆으로 휘어 불안정해질 수 있습니다.","explain":"이상적인 탄성좌굴에서 Pcr=π²EI/(KL)²입니다. E는 탄성계수, I는 단면2차모멘트, KL은 유효좌굴길이입니다.","contrast":"실제 강구조 설계강도 계산은 현행 설계기준과 불완전성을 반영해야 합니다. 이 식을 그대로 허용하중으로 쓰지 않습니다.","prerequisites":["stress27"],"questions":[{"id":"buckling-0","prompt":"다른 조건이 같고 유효길이가 2배이면 이상적 좌굴하중은?","choices":["2배","1/2배","1/4배"],"answer":2,"explanation":"길이의 제곱에 반비례하므로 1/4배입니다."},{"id":"buckling-1","prompt":"좌굴과 가장 직접적으로 관련된 현상은?","choices":["긴 압축부재의 옆굽음","전선의 발열","콘크리트 색 변화"],"answer":0,"explanation":"압축 중 안정성을 잃는 현상입니다."}]},{"id":"heat27","scopeId":"scope16","title":"열저항과 열관류율","sourceIds":["heat"],"minutes":7,"core":"열저항이 커질수록 열관류율은 작아집니다.","explain":"균질층의 열저항 R=d/λ입니다. d는 두께(m), λ는 열전도율(W/m·K). 벽 전체 열관류율 U=1/ΣR이며 표면 열저항도 포함합니다.","contrast":"열전도율은 재료 성질, 열관류율은 벽 전체 성능입니다. 규정 수치는 지역·용도·시점별 확인이 필요합니다.","prerequisites":[],"questions":[{"id":"heat27-0","prompt":"같은 재료의 두께를 2배로 하면 그 층의 열저항은?","choices":["2배","1/2배","변함없음"],"answer":0,"explanation":"d/λ에서 d만 2배가 됩니다."},{"id":"heat27-1","prompt":"표면을 포함한 총 열저항이 2m²·K/W이면 U는?","choices":["2W/m²·K","0.5W/m²·K","4W/m²·K"],"answer":1,"explanation":"1÷2=0.5W/m²·K입니다."}]},{"id":"passive","scopeId":"scope17","title":"건축적 조절과 설비의 관계","sourceIds":["env"],"minutes":7,"core":"건물의 열 유입을 줄이는 계획과 설비의 냉난방을 함께 검토합니다.","explain":"차양·단열 같은 건축적 조절은 부하에 영향을 줍니다. 설비 용량만 키우기 전에 건물과 이용 조건을 살펴보는 이유입니다.","contrast":"단열이 열 발생 자체를 없애거나 환기를 대체하는 것은 아닙니다.","prerequisites":[],"questions":[{"id":"passive-0","prompt":"여름 창문 일사 유입을 줄이기 위한 건축적 조절은?","choices":["차양 검토","보일러 온도 상승","급수압 상승"],"answer":0,"explanation":"차양은 유입 일사를 조절합니다."},{"id":"passive-1","prompt":"단열을 했으니 실내 오염물질 환기가 필요 없다는 말은?","choices":["맞다","겨울에는 항상 맞다","틀리다"],"answer":2,"explanation":"열 흐름 조절과 공기질 관리는 서로 다른 문제입니다."}]},{"id":"trap","scopeId":"scope17","title":"트랩과 봉수","sourceIds":["drain"],"minutes":7,"core":"트랩은 물막이인 봉수로 배수관의 악취가 실내로 들어오는 것을 막습니다.","explain":"트랩 내부에 남아 있는 물이 공기의 통로를 차단합니다. 장기간 미사용으로 물이 증발하거나 압력 변화로 물이 빠지면 기능을 잃을 수 있습니다.","contrast":"트랩은 오수를 영구 저장하는 탱크가 아닙니다.","prerequisites":[],"questions":[{"id":"trap-0","prompt":"장기간 사용하지 않은 바닥 배수구 악취의 가능한 원인은?","choices":["봉수 증발","전압 감소","단열 증가"],"answer":0,"explanation":"물막이가 사라지면 악취 유입 경로가 생깁니다."},{"id":"trap-1","prompt":"트랩이 악취를 차단하는 직접적인 요소는?","choices":["배관의 색","봉수","전선"],"answer":1,"explanation":"남아 있는 물이 공기 통로를 막습니다."}]},{"id":"vent","scopeId":"scope17","title":"배수 통기관의 역할","sourceIds":["drain"],"minutes":7,"core":"통기는 배수관 압력 변화를 완화해 봉수를 보호하고 배수를 돕습니다.","explain":"물이 급히 흐르면 배관 내부 공기 압력이 변합니다. 통기관을 통해 공기가 드나들도록 해 트랩 물이 과도하게 빨려 나가는 현상을 줄입니다.","contrast":"급수관과 통기관은 역할이 다릅니다. 실제 관경·배치는 별도 설계기준으로 확인합니다.","prerequisites":["trap"],"questions":[{"id":"vent-0","prompt":"통기관이 보호하는 주요 대상은?","choices":["트랩 봉수","전기 계량기","도장 색상"],"answer":0,"explanation":"압력 변화 완화가 봉수 유지에 도움이 됩니다."},{"id":"vent-1","prompt":"통기관을 급수관으로 설명하면?","choices":["정확한 설명","수압이 높을 때만 맞음","역할을 혼동한 설명"],"answer":2,"explanation":"통기관은 배수계통의 공기 흐름과 관련됩니다."}]},{"id":"ohm27","scopeId":"scope18","title":"전압·전류·저항","sourceIds":["ohm"],"minutes":7,"core":"옴성 저항에서는 전압=전류×저항입니다.","explain":"V=IR. V는 전압(V), I는 전류(A), R은 저항(Ω)입니다. 전압은 흐름을 만드는 차이, 저항은 흐름을 방해하는 정도로 이해하세요.","contrast":"모든 전기소자가 항상 일정 저항을 갖는 것은 아닙니다. 아래는 저항 일정인 직류 회로입니다.","prerequisites":[],"questions":[{"id":"ohm27-0","prompt":"12V가 4Ω 저항에 걸리면 전류는?","choices":["48A","3A","8A"],"answer":1,"explanation":"I=V/R=12/4=3A."},{"id":"ohm27-1","prompt":"전압 일정, 저항 2배이면 전류는?","choices":["2배","같음","1/2배"],"answer":2,"explanation":"I=V/R이므로 반으로 감소합니다."}]},{"id":"power27","scopeId":"scope18","title":"전력과 전기에너지","sourceIds":["power"],"minutes":7,"core":"전력은 단위 시간당 사용하는 에너지입니다.","explain":"직류에서 P=VI. V는 전압(V), I는 전류(A), P는 전력(W)입니다. 전력(kW)×시간(h)은 에너지(kWh)입니다.","contrast":"kW와 kWh를 구분합니다. 교류 일반 회로는 역률 등의 추가 조건이 있습니다.","prerequisites":["ohm27"],"questions":[{"id":"power27-0","prompt":"직류 24V, 2A의 전력은?","choices":["12W","48W","26W"],"answer":1,"explanation":"24×2=48W."},{"id":"power27-1","prompt":"1kW 기기를 3시간 사용한 에너지는?","choices":["3kWh","3kW","1/3kWh"],"answer":0,"explanation":"1×3=3kWh입니다."}]},{"id":"fire27","scopeId":"scope20","title":"연소의 기본요소","sourceIds":["fire"],"minutes":7,"core":"기본적인 연소에는 가연물·산소 공급·점화에너지가 필요합니다.","explain":"연료를 치우거나 산소 공급을 차단하거나 온도를 낮추는 방식으로 연소 조건을 약화시킵니다. 실제 소화약제는 화재 종류에 맞춰 선택해야 합니다.","contrast":"모든 화재에 물을 쓰는 것은 아닙니다. 여기서는 소화 원리만 학습합니다.","prerequisites":[],"questions":[{"id":"fire27-0","prompt":"온도를 낮추는 소화 원리는?","choices":["냉각","가열","연료 추가"],"answer":0,"explanation":"열을 제거해 연소 지속을 어렵게 합니다."},{"id":"fire27-1","prompt":"연료 공급을 끊는 조치는 어느 요소와 관계있나요?","choices":["산소만 증가","가연물 제거","온도 상승"],"answer":1,"explanation":"연소할 물질의 공급을 끊는 원리입니다."}]}]};

'use strict';
const KEY='architecture-study-v1', DAYS=['일','월','화','수','목','금','토'], STATES=['시작 전','진행 중','완료','연기'], UNIT_STATES=['미학습','학습 중','개념 학습 완료','문제 훈련 중','재복습 필요','확인 완료'];
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(d,n)=>{let x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)},dow=d=>new Date(d+'T12:00:00Z').getUTCDay(),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({schemaVersion:1,settings:{exam:'2027년 건축기사 필기 1회',targetDate:'',officialDate:'',temporary:true,capacity:[0,30,30,30,30,30,60]},subjects:['건축계획','건축시공','건축구조','건축설비','건축법규'].map(name=>({id:uid(),name})),units:[],tasks:[],sets:[],attempts:[]});
let state=initial(),tab='today',week=today(),shortMode=false,activeQ=null,selected=new Set(),preview=[];const $=s=>document.querySelector(s);
function validDate(d,empty=false){return empty&&d===''||typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d+'T12:00:00Z'))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d}
function assert(v,msg){if(!v)throw Error(msg)}
function validateSet(s){assert(s&&typeof s.id==='string'&&s.id.length>0&&!s.id.includes('|')&&typeof s.title==='string'&&typeof s.isTest==='boolean'&&Array.isArray(s.questions),'문제 세트 필수 필드를 확인하세요.');let ids=new Set();s.questions.forEach(q=>{assert(q&&typeof q.id==='string'&&q.id.length>0&&!q.id.includes('|')&&!ids.has(q.id),'문제 ID가 없거나 중복됩니다.');ids.add(q.id);['subject','unit','prompt','explanation','source'].forEach(k=>assert(typeof q[k]==='string',k+'는 문자열이어야 합니다.'));assert(typeof q.originalPage==='string'||Number.isInteger(q.originalPage),'원본 페이지를 확인하세요.');assert(Array.isArray(q.choices)&&q.choices.length>=2&&q.choices.every(c=>typeof c==='string'),'선택지는 2개 이상이어야 합니다.');assert(Number.isInteger(q.answerIndex)&&q.answerIndex>=0&&q.answerIndex<q.choices.length,'정답 인덱스가 잘못됐습니다.');assert(q.image===null||typeof q.image==='string'&&(/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/.test(q.image)),'이미지는 HTTPS URL, PNG/JPEG/WebP data URL 또는 null이어야 합니다.');});return s}
function validate(s){assert(s&&s.schemaVersion===1&&s.settings,'지원하지 않는 백업 형식입니다.');let z=s.settings;assert(typeof z.exam==='string'&&z.exam.trim()&&typeof z.temporary==='boolean'&&validDate(z.targetDate,true)&&validDate(z.officialDate,true),'설정 값이 잘못됐습니다.');assert(Array.isArray(z.capacity)&&z.capacity.length===7&&z.capacity.every(n=>Number.isInteger(n)&&n>=0&&n<=1440),'요일별 시간을 확인하세요.');['subjects','units','tasks','sets','attempts'].forEach(k=>assert(Array.isArray(s[k]),k+' 목록이 없습니다.'));for(const k of ['subjects','units','tasks','sets','attempts']){let a=s[k].map(x=>x.id);assert(a.every(x=>typeof x==='string')&&new Set(a).size===a.length,k+' ID 중복 또는 누락');}s.subjects.forEach(x=>assert(typeof x.name==='string'&&x.name.trim(),'과목 이름 오류'));s.units.forEach(x=>assert(s.subjects.some(y=>y.id===x.subjectId)&&typeof x.name==='string'&&UNIT_STATES.includes(x.status),'단원 데이터 오류'));s.tasks.forEach(x=>assert(typeof x.title==='string'&&x.title.trim()&&validDate(x.date)&&Number.isInteger(x.minutes)&&x.minutes>0&&x.minutes<=1440&&Number.isInteger(x.priority)&&STATES.includes(x.status)&&typeof x.note==='string'&&typeof x.subjectId==='string'&&typeof x.unitId==='string'&&(x.subjectId===''||s.subjects.some(a=>a.id===x.subjectId))&&(x.unitId===''||s.units.some(a=>a.id===x.unitId&&a.subjectId===x.subjectId))&&(x.completedAt===null||typeof x.completedAt==='string'&&!isNaN(Date.parse(x.completedAt))),'과제 데이터 오류'));s.sets.forEach(validateSet);s.attempts.forEach(x=>{let set=s.sets.find(y=>y.id===x.setId),q=set?.questions.find(y=>y.id===x.questionId);assert(q&&Number.isInteger(x.selected)&&x.selected>=0&&x.selected<q.choices.length&&typeof x.correct==='boolean'&&x.correct===(x.selected===q.answerIndex)&&typeof x.at==='string'&&!isNaN(Date.parse(x.at)),'풀이 기록 오류');});if(s.learning!==undefined)validateLearning(s.learning);if(s.curriculum!==undefined)validateCurriculum(s.curriculum);return s}
try{let raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('#storageError').hidden=false;$('#storageError').textContent='저장 데이터를 읽거나 저장하지 못했습니다. 기존 저장값을 자동 삭제하지 않았습니다. 백업을 내보내고 복원하세요. '+e.message;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#storageError').hidden=true;return true}catch(e){$('#storageError').hidden=false;$('#storageError').textContent='브라우저 저장 실패: 변경 내용은 현재 화면에만 남아 있습니다. 지금 JSON 백업을 내보내세요.';return false}}
function toast(s){$('#notice').textContent=s;$('#notice').hidden=false;setTimeout(()=>$('#notice').hidden=true,3500)}
const name=id=>state.subjects.find(x=>x.id===id)?.name||'준비',unitName=id=>state.units.find(x=>x.id===id)?.name||'단원 미지정',sum=a=>a.reduce((n,x)=>n+x.minutes,0),sort=a=>[...a].sort((a,b)=>a.priority-b.priority||a.date.localeCompare(b.date)),tasksFor=d=>sort(state.tasks.filter(x=>x.date===d)),capacity=d=>state.settings.capacity[dow(d)];
function button(label,action,id='',cls=''){return `<button type="button" class="${cls}" data-action="${action}" data-id="${esc(id)}">${label}</button>`}
function open(html){$('#modal').innerHTML=html;$('#modal').showModal()}function close(){$('#modal').close()}
function render(){const labels={today:'오늘 학습',concept:'학습실',progress:'내 학습현황',changes:'2027 변경 안내',drill:'구조 계산 훈련',week:'주간 계획',bank:'문제은행',settings:'설정·백업'};$('#nav').innerHTML=Object.entries(labels).map(([k,v])=>button(v,'tab',k,k===tab?'active':'')).join('');let s=state.settings,remaining=s.targetDate?Math.round((Date.parse(s.targetDate+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000):null;$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">STUDY WORKSPACE</div><h1>${labels[tab]}</h1><div class="muted">${esc(s.exam)} · 공식 시험일 ${s.officialDate?esc(s.officialDate):'일정 미확정'}</div></div><div><span class="pill">${today()} · 한국 시간</span>${remaining!==null?`<p class="muted">개인 학습 목표 ${remaining>0?'D−'+remaining:remaining===0?'D-day':'D+'+Math.abs(remaining)}</p>`:''}</div></div>${({changes:renderChanges,today:renderToday,concept:renderCurriculum,drill:renderConcept,week:renderWeek,progress:renderProgress,bank:renderBank,settings:renderSettings}[tab])()}<p class="muted" style="font-size:12px;margin-top:30px">현재 기기·브라우저에 저장됩니다. 자동 동기화되지 않습니다. ${location.protocol==='file:'?'파일 실행 시 저장이 제한될 수 있습니다. 새로고침 확인과 JSON 백업을 권장합니다.':''}</p>`;}
function taskCard(t,i){return `<article class="task ${t.status==='완료'?'done':''}"><div class="row between"><span class="pill">${i+1} · ${esc(name(t.subjectId))} / ${esc(unitName(t.unitId))}</span><span class="status">${t.status} · ${t.minutes}분</span></div><p class="title">${esc(t.title)}</p>${t.note?`<p class="note">${esc(t.note)}</p>`:''}<div class="actions">${t.status==='완료'?button('완료 취소','undo',t.id):button(t.status==='진행 중'?'이어서 공부':'시작','start',t.id)+button('완료','done',t.id)+button('연기','defer',t.id)}${button('수정·메모','edit',t.id)}</div></article>`}
function renderToday(){let all=tasksFor(today()),pending=all.filter(t=>t.status!=='완료'),shown=all;if(shortMode){let left=15;shown=sort(pending).filter(t=>{if(t.minutes<=left){left-=t.minutes;return true}return false})}let overdue=state.tasks.filter(t=>t.date<today()&&t.status!=='완료').length;return `<div class="cards"><div class="card"><small>오늘 예정 / 가능 시간</small><strong>${sum(all)} <small>/ ${capacity(today())}분</small></strong></div><div class="card"><small>오늘 완료한 과제</small><strong>${all.filter(t=>t.status==='완료').length} <small>/ ${all.length}개</small></strong></div><div class="card"><small>시간 설정</small><strong style="font-size:20px">${state.settings.temporary?'임시 설정':'사용자 확정'}</strong><small>설정에서 언제든 수정</small></div></div><section class="hero"><div class="eyebrow" style="color:#b8d0ff">ONE TASK AT A TIME</div><h2>오늘은 이 과제부터 시작하세요.</h2><p class="muted">${pending.length?esc(pending[0].title):'작은 과제 하나를 등록하고 시작하세요.'}</p>${button('오늘 공부 시작','begin','','primary')}${button('개념학습 시작','conceptBegin')}${button('이어서 공부','resume')}${button('오늘은 15분만','short')}</section>${sum(all)>capacity(today())?'<p class="warn">오늘 예정 시간이 가능 시간을 초과합니다. 분량이나 날짜를 조정하세요.</p>':''}${overdue?`<p class="warn">지난 미완료 과제 ${overdue}개가 있습니다. ${button('다시 배정','tab','week')}</p>`:''}<div class="row between"><h2>${shortMode?'15분 안에 가능한 과제':'오늘 할 일'}</h2><div>${shortMode?button('전체 보기','full'):''}${button('+ 과제 추가','add',today(),'primary')}</div></div>${shortMode?'<p class="muted">우선순위 순서로 남은 15분 안에 들어가는 과제만 표시합니다. 나머지 과제는 그대로 보존됩니다.</p>':''}${shown.map(taskCard).join('')||`<div class="empty">${shortMode?'15분 안에 들어오는 과제가 없습니다. 전체 보기에서 과제를 나누어 등록하거나 예상 시간을 수정하세요.':'아직 오늘 과제가 없습니다.'}</div>`}${!['교재 목차 등록','공부 가능 시간 확정','첫 학습 단원 선택'].every(title=>state.tasks.some(t=>t.title===title))?`<section class="panel"><h3>처음 시작하는 세 단계</h3><p class="muted">버튼을 누르면 오늘 할 과제로 직접 추가됩니다. 완료 기록은 자동 생성하지 않습니다.</p><div class="actions">${['교재 목차 등록','공부 가능 시간 확정','첫 학습 단원 선택'].map((x,i)=>state.tasks.some(t=>t.title===x)?'<span class="pill">'+x+' · 등록됨</span>':button('+ '+x,'onboard',String(i))).join('')}</div></section>`:''}`}
function monday(d){return addDays(d,-((dow(d)+6)%7))}
function renderWeek(){let start=monday(week),a=Array.from({length:7},(_,i)=>addDays(start,i));return `<div class="row between" style="margin-bottom:18px"><div>${button('← 이전 주','prev')}${button('이번 주','thisweek')}${button('다음 주 →','next')}</div>${button('+ 과제 추가','add',today(),'primary')}</div><p class="muted">${start} ~ ${a[6]} · 시간 설정: ${state.settings.temporary?'임시 설정':'사용자 확정'}</p><div class="week">${a.map(d=>{let t=tasksFor(d),n=sum(t);return `<section class="day"><strong>${DAYS[dow(d)]} <small>${d.slice(5)}</small></strong><div class="${n>capacity(d)?'warn':'muted'}">${n} / ${capacity(d)}분 ${n>capacity(d)?'초과':''}</div>${t.map(x=>button(esc(x.title)+`<br>${x.minutes}분 · ${x.status}`,'edit',x.id)).join('')}${button('+ 추가','add',d)}</section>`}).join('')}</div><section class="panel"><h2>미완료 과제 재배치</h2><p class="muted">선택한 과제를 우선순위·기존 날짜 순으로, 오늘 이후 남은 시간에 통째로 들어가는 첫 날짜에 배정합니다. 완료 과제는 이동하지 않습니다. 목표일이 없으면 90일까지만 탐색합니다.</p>${state.tasks.filter(t=>t.status!=='완료').map(t=>`<label class="row"><input style="width:auto" type="checkbox" data-select="${t.id}" ${selected.has(t.id)?'checked':''}>${esc(t.title)} · ${t.date} · ${t.minutes}분</label>`).join('')||'<p>재배치할 미완료 과제가 없습니다.</p>'}<div class="actions">${button('변경 미리보기','replan','','primary')}${button('가능 시간 수정','tab','settings')}</div></section>`}
function realAttempts(){return state.attempts.filter(a=>!state.sets.find(s=>s.id===a.setId)?.isTest)}
function renderProgress(){let total=state.tasks.length,done=state.tasks.filter(t=>t.status==='완료').length,p=total?Math.round(done/total*100):0,at=realAttempts();return `<section class="panel"><h2>과제 수행률</h2><strong style="font-size:32px">${total?p+'%':'아직 기록이 없습니다'}</strong><div class="bar"><i style="width:${p}%"></i></div><p class="muted">전체 계획 과제 ${total}개 중 ${done}개 완료 · 개념 숙달도와 별개입니다.</p></section><section class="panel" style="margin-top:20px"><div class="row between"><h2>단원 학습 상태</h2>${button('과목·단원 편집','tab','settings')}</div><p class="muted">사용자가 수동 변경한 상태입니다. 자동 평가가 아닙니다.</p>${state.units.map(u=>`<div class="unit row between"><span>${esc(name(u.subjectId))} · ${esc(u.name)}</span><select aria-label="${esc(u.name)} 상태" data-unit="${u.id}">${UNIT_STATES.map(x=>`<option ${x===u.status?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<p>아직 등록된 단원이 없습니다. 설정에서 교재 목차를 직접 등록하세요.</p>'}</section><section class="panel" style="margin-top:20px"><h2>문제 풀이 기록</h2>${at.length?`<p>실제 문제 제출 ${at.length}회 · 정답 ${at.filter(a=>a.correct).length}회 · 제출 기준 정답률 ${Math.round(at.filter(a=>a.correct).length/at.length*100)}%</p><small>반복 풀이를 포함합니다. 기능 테스트용 예시는 제외됩니다.</small>`:'<p>아직 기록이 없습니다. 문제 세트를 불러오고 답을 제출하면 표시됩니다.</p>'}</section>`}
function renderBank(){let wrong=[];state.sets.forEach(s=>s.questions.forEach(q=>{let a=state.attempts.filter(a=>a.setId===s.id&&a.questionId===q.id).at(-1);if(a&&!a.correct)wrong.push({s,q})}));return `<section class="panel"><div class="row between"><h2>나의 문제 세트</h2><label class="file">문제 세트 JSON 불러오기<input hidden type="file" id="setFile" accept=".json,application/json"></label></div><p class="muted">실제 기출문제는 포함하지 않았습니다. 답 제출 후 정답과 해설이 공개됩니다.</p><div class="actions">${button('JSON 형식·예시 다운로드','sample')}</div>${!state.sets.length?'<div class="empty">아직 문제 세트가 없습니다.<br><small>준비된 JSON 파일을 불러와 시작하세요.</small></div>':state.sets.map(s=>`<div class="unit"><h3>${esc(s.title)} ${s.isTest?'<span class="pill">기능 테스트용 예시 · 통계 제외</span>':''}</h3><p>${s.questions.length}문제 · ${esc([...new Set(s.questions.map(q=>q.subject+' / '+q.unit))].join(', '))}</p>${s.questions.map((q,i)=>button((i+1)+'. '+esc(q.prompt.slice(0,35)),'question',s.id+'|'+q.id)).join(' ')}</div>`).join('')}</section><section class="panel" style="margin-top:20px"><h2>틀린 문제 목록</h2><p class="muted">문제별 가장 최근 풀이가 오답인 항목입니다.</p>${wrong.map(({s,q})=>button((s.isTest?'[테스트] ':'')+esc(q.prompt.slice(0,55)),'question',s.id+'|'+q.id)).join(' ')||'<p>아직 오답 기록이 없습니다.</p>'}</section>`}
function renderSettings(){let s=state.settings;return `<div class="grid2"><section class="panel"><h2>목표와 가능 시간</h2><form id="settingsForm"><label>목표 시험·회차<input name="exam" required value="${esc(s.exam)}"></label><label>개인 학습 목표일<input type="date" name="targetDate" value="${s.targetDate}"></label><label>공식 시험일 (공식 자료 확인 후 직접 입력)<input type="date" name="officialDate" value="${s.officialDate}"></label><p class="muted">미입력 시 일정 미확정으로 표시합니다. 개인 목표일과 별개입니다.</p><label>요일별 가능 시간 (분)</label><div class="days-input">${[1,2,3,4,5,6,0].map(i=>`<label>${DAYS[i]}<input aria-label="${DAYS[i]} 가능 시간" type="number" name="cap${i}" min="0" max="1440" required value="${s.capacity[i]}"></label>`).join('')}</div><label class="row"><input style="width:auto" name="temporary" type="checkbox" ${s.temporary?'checked':''}>임시 설정으로 표시</label><button class="primary" type="submit">설정 저장</button></form></section><section class="panel"><h2>백업과 학습 보고서</h2><p>현재 기기·브라우저에 저장됩니다. 다른 기기에서는 JSON 백업을 직접 불러오세요.</p><div class="actions">${button('전체 데이터 내보내기','export','','primary')}<label class="file">백업 JSON 불러오기<input hidden type="file" id="backupFile" accept=".json,application/json"></label>${button('GPT용 학습 보고서 복사','report')}</div><p class="muted">복원 전 파일 전체를 검증하고 덮어쓰기 확인을 요청합니다. 정기적으로 백업을 보관하세요.</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>다음 단계 확장</h3><p class="muted">PDF 문제 변환 · AI API · 노션 · 로그인 · 기기 간 동기화는 연결되어 있지 않습니다.</p></section></div><section class="panel" style="margin-top:20px"><div class="row between"><h2>과목·단원 관리</h2><div>${button('+ 과목','subject')}${button('+ 단원','unit')}</div></div><p class="muted">아래 과목은 편집 가능한 학습 분류입니다. 2027년 공식 출제 구성을 확정한 목록이 아닙니다. 교재 페이지와 세부 단원은 직접 등록하세요.</p>${state.subjects.map(s=>`<div class="unit"><div class="row between"><strong>${esc(s.name)}</strong>${button('과목 수정','subject',s.id)}</div>${state.units.filter(u=>u.subjectId===s.id).map(u=>`<div class="row between"><span>${esc(u.name)} · ${u.status}</span>${button('단원 수정','unit',u.id)}</div>`).join('')||'<small>등록된 단원 없음</small>'}</div>`).join('')}</section>`}
function taskEditor(id='',date=today()){let t=state.tasks.find(x=>x.id===id)||{title:'',date,minutes:15,priority:state.tasks.length+1,subjectId:'',unitId:'',note:''};open(`<h2>${id?'과제 수정':'새 과제'}</h2>${t.status==='완료'?'<p class="muted">완료 날짜·분량은 보존됩니다. 변경하려면 먼저 완료를 취소하세요.</p>':''}<form id="taskForm" data-id="${id}"><label>구체적인 할 일<input name="title" required maxlength="300" value="${esc(t.title)}"></label><div class="grid2"><label>과목<select name="subjectId"><option value="">준비</option>${state.subjects.map(s=>`<option value="${s.id}" ${t.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>단원<select name="unitId"><option value="">단원 미지정</option>${state.units.map(u=>`<option value="${u.id}" ${t.unitId===u.id?'selected':''}>${esc(name(u.subjectId))} / ${esc(u.name)}</option>`).join('')}</select></label></div><div class="grid2"><label>날짜<input name="date" type="date" required value="${t.date}" ${t.status==='완료'?'disabled':''}></label><label>예상 시간 (분)<input name="minutes" type="number" min="1" max="1440" required value="${t.minutes}" ${t.status==='완료'?'disabled':''}></label></div><label>순서 / 우선순위 (작을수록 먼저)<input name="priority" type="number" min="1" max="99999" required value="${t.priority}"></label><label>메모<textarea name="note">${esc(t.note)}</textarea></label><div class="actions">${id?button('삭제','delete',id,'danger'):''}${button('취소','close')}<button type="submit" class="primary">저장</button></div></form>`)}
function plan(ids){let chosen=sort(state.tasks.filter(t=>ids.has(t.id)&&t.status!=='완료')),load={};state.tasks.filter(t=>!ids.has(t.id)||t.status==='완료').forEach(t=>load[t.date]=(load[t.date]||0)+t.minutes);let end=state.settings.targetDate||addDays(today(),89);return chosen.map(t=>{let date=null;for(let d=today();d<=end;d=addDays(d,1)){if((load[d]||0)+t.minutes<=capacity(d)){date=d;load[d]=(load[d]||0)+t.minutes;break}}return {id:t.id,title:t.title,old:t.date,date,minutes:t.minutes}})}
const sample={id:'function-test-1',title:'기능 테스트용 예시',isTest:true,questions:[{id:'test-001',subject:'기능 테스트',unit:'선택·제출 확인',prompt:'기능 테스트용 예시입니다. 두 번째 선택지를 선택하세요. (실제 기출 아님)',choices:['첫 번째 선택지','두 번째 선택지','세 번째 선택지'],answerIndex:1,explanation:'JSON 불러오기와 답 제출 기능을 확인하기 위한 예시입니다. 실제 학습 통계에서 제외됩니다.',source:'기능 테스트용 예시 — 실제 기출 아님',originalPage:'',image:null}]};
function download(filename,data,type='application/json'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function report(){let at=realAttempts();return `건축기사 학습 보고서 (${today()}, 한국 시간)\n목표: ${state.settings.exam}\n개인 목표일: ${state.settings.targetDate||'미설정'} / 공식 시험일: ${state.settings.officialDate||'일정 미확정'}\n최근 완료 과제 (최근 10개):\n${state.tasks.filter(t=>t.status==='완료').sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,10).map(t=>'- '+t.title+' / '+t.minutes+'분 / 완료 '+t.completedAt).join('\n')||'없음'}\n미완료 과제:\n${state.tasks.filter(t=>t.status!=='완료').map(t=>'- '+t.date+' '+t.title+' '+t.minutes+'분 ('+t.status+')').join('\n')||'없음'}\n단원 상태 (사용자 수동 변경):\n${state.units.map(u=>'- '+name(u.subjectId)+' / '+u.name+': '+u.status).join('\n')||'등록 없음'}\n${at.length?'문제 풀이: '+at.length+'회 제출 / 정답 '+at.filter(a=>a.correct).length+'회 (반복 포함, 테스트 제외)':'문제 풀이 기록 없음'}\n다음 주 가능 시간 (${state.settings.temporary?'임시 설정':'사용자 확정'}):\n${Array.from({length:7},(_,i)=>addDays(monday(today()),7+i)).map(d=>d+' '+DAYS[dow(d)]+' '+capacity(d)+'분').join('\n')}\n다음 과제: ${sort(state.tasks.filter(t=>t.status!=='완료'))[0]?.title||'미등록'}`}
function question(id){let [sid,qid]=id.split('|'),s=state.sets.find(s=>s.id===sid),q=s.questions.find(q=>q.id===qid);activeQ={s,q};open(`<span class="pill">${s.isTest?'기능 테스트용 예시 · 통계 제외':esc(q.subject+' / '+q.unit)}</span><h2 style="margin-top:15px">문제 풀이</h2><p class="question">${esc(q.prompt)}</p>${q.image?`<img src="${esc(q.image)}" alt="문제 그림" style="max-width:100%;max-height:300px">`:''}<form id="answerForm">${q.choices.map((c,i)=>`<label class="choice"><input required type="radio" name="answer" value="${i}">${i+1}. ${esc(c)}</label>`).join('')}<p class="muted">출처: ${esc(q.source)||'미기재'} · 원본 페이지: ${esc(q.originalPage)||'미기재'}</p><div id="feedback"></div><div class="actions">${button('닫기','close')}<button id="submitAnswer" type="submit" class="primary">답 제출</button></div></form>`)}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let {action:a,id}=b.dataset,t=state.tasks.find(t=>t.id===id);if(a==='tab'){tab=id;shortMode=false;render()}if(a==='close')close();if(a==='add')taskEditor('',id);if(a==='edit')taskEditor(id);if(a==='start'){t.status='진행 중';save();render();toast('시작했습니다. 끝나면 완료를 눌러주세요.')}if(a==='done'){t.status='완료';t.completedAt=new Date().toISOString();save();render()}if(a==='undo'){t.status='시작 전';t.completedAt=null;save();render()}if(a==='defer'){t.status='연기';save();render();toast('연기했습니다. 주간 계획에서 새 날짜를 배정하세요.')}if(a==='delete'&&confirm('이 과제와 완료 기록을 삭제할까요?')){state.tasks=state.tasks.filter(t=>t.id!==id);selected.delete(id);save();close();render()}if(a==='begin'||a==='resume'){let pending=tasksFor(today()).filter(t=>t.status!=='완료'),x=a==='resume'?pending.find(t=>t.status==='진행 중')||pending[0]:pending[0];if(x){x.status='진행 중';save();render();taskEditor(x.id)}else toast('오늘 과제를 먼저 추가하세요.')}if(a==='short'||a==='full'){shortMode=a==='short';render()}if(a==='onboard'){let title=['교재 목차 등록','공부 가능 시간 확정','첫 학습 단원 선택'][+id];state.tasks.push({id:uid(),title,date:today(),minutes:5,priority:+id+1,subjectId:'',unitId:'',note:'설정 화면에서 등록·확인한 뒤 직접 완료하세요.',status:'시작 전',completedAt:null});save();render()}if(['prev','next','thisweek'].includes(a)){week=a==='thisweek'?today():addDays(week,a==='prev'?-7:7);render()}if(a==='replan'){preview=plan(selected);if(!preview.length)return toast('재배치할 미완료 과제를 선택하세요.');open(`<h2>날짜 변경 미리보기</h2><p>확인한 과제만 이동합니다. 배정 불가 과제는 기존 날짜에 남습니다.</p>${preview.map(p=>`<p class="${p.date?'':'warn'}">${esc(p.title)} · ${p.minutes}분<br>${p.old} → <strong>${p.date||'배정 불가: 목표일 또는 탐색 기간 내 여유 없음'}</strong></p>`).join('')}<div class="actions">${button('취소','close')}${button('변경 적용','applyPlan','','primary')}</div>`)}if(a==='applyPlan'){preview.forEach(p=>{let x=state.tasks.find(t=>t.id===p.id);if(p.date&&x&&x.status!=='완료')x.date=p.date});selected.clear();save();close();render()}if(a==='export')download('건축기사-백업-'+today()+'.json',state);if(a==='sample')download('question-set-example.json',sample);if(a==='report'){let text=report();try{await navigator.clipboard.writeText(text);toast('학습 보고서를 복사했습니다.')}catch{open(`<h2>학습 보고서</h2><p>아래 내용을 선택해 복사하세요.</p><textarea style="height:350px">${esc(text)}</textarea>${button('닫기','close')}`)}}if(a==='question')question(id);if(a==='subject'||a==='unit'){let obj=(a==='subject'?state.subjects:state.units).find(x=>x.id===id);open(`<h2>${a==='subject'?'과목':'단원'} ${id?'수정':'추가'}</h2><form id="taxonomyForm" data-kind="${a}" data-id="${id}">${a==='unit'?`<label>과목<select name="subjectId">${state.subjects.map(s=>`<option value="${s.id}" ${s.id===obj?.subjectId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}<label>이름<input name="name" required maxlength="200" value="${esc(obj?.name||'')}"></label><div class="actions">${button('취소','close')}<button class="primary">저장</button></div></form>`)}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='taskForm'){let old=state.tasks.find(t=>t.id===f.dataset.id),v={title:String(d.get('title')).trim(),date:old?.status==='완료'?old.date:d.get('date'),minutes:old?.status==='완료'?old.minutes:Number(d.get('minutes')),priority:Number(d.get('priority')),subjectId:d.get('subjectId'),unitId:d.get('unitId'),note:d.get('note')};if(!v.title)return toast('할 일을 입력하세요.');if(v.unitId&&!state.units.some(u=>u.id===v.unitId&&u.subjectId===v.subjectId))return toast('선택한 과목에 속하는 단원을 선택하세요.');if(old&&old.date!==v.date&&!confirm(old.date+' → '+v.date+' 날짜를 변경할까요?'))return;if(old)Object.assign(old,v);else state.tasks.push({id:uid(),...v,status:'시작 전',completedAt:null});save();close();render()}if(f.id==='settingsForm'){state.settings={exam:String(d.get('exam')).trim(),targetDate:d.get('targetDate'),officialDate:d.get('officialDate'),capacity:Array.from({length:7},(_,i)=>Number(d.get('cap'+i))),temporary:d.has('temporary')};save();render();toast('설정을 저장했습니다. 기존 과제 날짜는 유지됩니다.')}if(f.id==='taxonomyForm'){let k=f.dataset.kind,id=f.dataset.id,arr=k==='subject'?state.subjects:state.units,obj=arr.find(x=>x.id===id),n=String(d.get('name')).trim();if(!n)return;if(obj){obj.name=n;if(k==='unit'){obj.subjectId=d.get('subjectId');state.tasks.filter(t=>t.unitId===obj.id).forEach(t=>t.subjectId=obj.subjectId)}}else arr.push({id:uid(),name:n,...(k==='unit'?{subjectId:d.get('subjectId'),status:'미학습'}:{})});save();close();render()}if(f.id==='answerForm'){if($('#submitAnswer').disabled)return;let {s,q}=activeQ,answer=Number(d.get('answer')),correct=answer===q.answerIndex;state.attempts.push({id:uid(),setId:s.id,questionId:q.id,selected:answer,correct,at:new Date().toISOString()});save();$('#submitAnswer').disabled=true;f.querySelectorAll('input').forEach(x=>x.disabled=true);$('#feedback').innerHTML=`<div class="note"><strong>${correct?'정답입니다.':'오답입니다.'} 정답: ${q.answerIndex+1}번</strong><p>${esc(q.explanation)}</p></div>`;render()}});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.select){el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select)}if(el.dataset.unit){state.units.find(u=>u.id===el.dataset.unit).status=el.value;save();toast('사용자가 변경한 단원 상태를 저장했습니다.')}if(el.id==='setFile'||el.id==='backupFile'){let file=el.files[0];if(!file)return;try{assert(file.size<20*1024*1024,'20MB 이하의 JSON 파일을 사용하세요.');let data=JSON.parse(await file.text());if(el.id==='backupFile'){validate(data);if(!confirm(`검증 완료: 과제 ${data.tasks.length}개, 문제 세트 ${data.sets.length}개. 현재 모든 데이터를 이 백업으로 덮어씁니다. 먼저 내보내기를 권장합니다. 적용할까요?`))return;state=data;selected.clear();activeQ=null;}else{validateSet(data);assert(!state.sets.some(s=>s.id===data.id),'같은 ID의 문제 세트가 이미 있습니다.');state.sets.push(data)}save();render();toast('불러오기를 완료했습니다.')}catch(err){toast('불러오기 실패: '+err.message+' 기존 데이터는 유지됩니다.')}el.value=''}});

function validateLearning(l){const ids=['balance','reaction','moment','conversion','equation'];assert(l&&l.version===1&&Number.isInteger(l.sequence)&&l.sequence>=0&&Array.isArray(l.records),'개념학습 백업 형식 오류');let seen=new Set();l.records.forEach(r=>{assert(r&&typeof r.id==='string'&&!seen.has(r.id)&&ids.includes(r.skill)&&typeof r.questionId==='string'&&Number.isInteger(r.sequence)&&r.sequence>=0&&typeof r.at==='string'&&!isNaN(Date.parse(r.at))&&validDate(r.date)&&typeof r.correct==='boolean'&&typeof r.independent==='boolean'&&typeof r.first==='boolean'&&typeof r.error==='string'&&typeof r.input==='string'&&typeof r.expression==='string'&&typeof r.unit==='string'&&typeof r.reason==='string'&&['확신','추측'].includes(r.confidence)&&Number.isInteger(r.hints)&&r.hints>=0,'개념학습 풀이 기록 오류');seen.add(r.id)});if(l.current!==null){let c=l.current;assert(c&&ids.includes(c.skill)&&typeof c.id==='string'&&Number.isInteger(c.n)&&c.n>=0&&Number.isInteger(c.tries)&&c.tries>=0&&Number.isInteger(c.hints)&&c.hints>=0&&typeof c.revealed==='boolean'&&typeof c.solved==='boolean'&&(c.last===null||typeof c.last==='string')&&c.draft&&['answer','expression','unit','reason','confidence'].every(k=>typeof c.draft[k]==='string'),'진행 중 개념학습 데이터 오류')}}
// Numeric expression parser: no eval, functions, assignments or executable code.
function parseMath(raw){let s=raw.normalize('NFKC').replace(/[×xX]/g,'*').replace(/[÷]/g,'/').replace(/[−–]/g,'-').replace(/\s/g,'');if(s.length>180||!s||/[^0-9.+*/()\-]/.test(s))throw Error('숫자와 + − × ÷ / 괄호만 입력하세요. 변수·등호·단위는 빼주세요.');let tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+*/-]/g)||[],i=0;if(tokens.join('')!==s)throw Error('수식 형식을 확인하세요.');function factor(){let t=tokens[i++];if(t==='+'||t==='-')return (t==='-'?-1:1)*factor();if(t==='('){let v=expr();if(tokens[i++]!==')')throw Error('괄호를 확인하세요.');return v}if(t===undefined||!/^(\d+(\.\d*)?|\.\d+)$/.test(t))throw Error('수식을 끝까지 입력하세요.');return Number(t)}function term(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){let o=tokens[i++],r=factor();if(o==='/'&&r===0)throw Error('0으로 나눌 수 없습니다.');v=o==='*'?v*r:v/r}return v}function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){let o=tokens[i++],r=term();v=o==='+'?v+r:v-r}return v}let result=expr();if(i!==tokens.length||!Number.isFinite(result))throw Error('유효한 계산식을 입력하세요.');return {value:result,operation:/[*/+\-]/.test(s.replace(/^[+-]/,''))}}
function makeQuestion(skill,n){let variants=[[12,2,4],[18,4,2],[20,3,2],[24,2,6],[30,6,4],[16,3,5],[21,4,3]], [P,a,b]=variants[n%variants.length],L=a+b,F=[3,4,6,8,5][n%5],d=[2,3,4,5,6][n%5],mm=[250,500,750,1250,1500][n%5];let q={skill,P,a,b,L,F,d,mm};if(skill==='balance'){q.known=P*a/L;q.answer=P-q.known;q.unit='kN';q.prompt=`아래 보의 오른쪽 수직 반력 VB가 ${+q.known.toFixed(3)}kN입니다. 왼쪽 반력 VA를 구하세요.`;q.expression=`${P} - ${+q.known.toFixed(3)}`;q.reason='vertical';q.hint='위쪽 반력의 합은 전체 하중과 같습니다. 알려진 반력을 전체 하중에서 빼세요.'}if(skill==='reaction'){q.answer=P*b/L;q.unit='kN';q.prompt='왼쪽 받침 A의 수직 반력 VA를 구하세요.';q.expression=`${P} * ${b} / (${a} + ${b})`;q.reason='atB';q.hint='B점을 기준으로 생각하세요. 하중에서 B까지 거리 b를 전체 길이로 나눈 비율을 사용합니다.'}if(skill==='moment'){q.answer=F*d;q.unit='kN·m';q.prompt='O점을 기준으로 힘이 만드는 모멘트의 크기를 구하세요. 힘은 막대에 직각으로 작용합니다.';q.expression=`${F} * ${d}`;q.reason='turn';q.hint='모멘트의 크기는 힘 × 회전 중심에서 힘의 작용선까지 수직거리입니다.'}if(skill==='conversion'){q.answer=F*mm/1000;q.unit='kN·m';q.prompt='O점에 대한 모멘트의 크기를 kN·m로 구하세요. 힘은 막대에 직각으로 작용합니다.';q.expression=`${F} * (${mm} / 1000)`;q.reason='convert';q.hint='먼저 mm를 1000으로 나누어 m로 바꾸세요. 그 다음 힘을 곱합니다.'}if(skill==='equation'){q.answer=P*a/L;q.unit='kN';q.prompt='A점을 모멘트 기준점으로 삼아 오른쪽 수직 반력 VB를 구하세요.';q.expression=`${P} * ${a} / ${L}`;q.reason='atA';q.hint='A 기준: VB × 전체 길이 = 하중 × A에서 하중까지 거리입니다.'}return q}
function diagram(q){let isM=['moment','conversion'].includes(q.skill),x=isM?440:80+440*q.a/q.L,base=`<svg viewBox="0 0 600 245" role="img" aria-label="${esc(isM?'O점에서 직각 하중까지 거리와 하중을 표시한 도식':'A와 B가 받치는 단순보, 하중 위치 및 거리 도식')}" style="width:100%;max-height:280px;background:#f6f9fd;border-radius:12px"><defs><marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#254c9a"/></marker></defs><g font-family="sans-serif" font-size="17" fill="#172c4c"><line x1="80" y1="125" x2="520" y2="125" stroke="#172c4c" stroke-width="5"/><line x1="${x}" y1="48" x2="${x}" y2="118" stroke="#254c9a" stroke-width="3" marker-end="url(#arrowC)"/><text x="${x}" y="32" text-anchor="middle">${isM?q.F:q.P} kN</text>`;if(isM)return base+`<circle cx="80" cy="125" r="6" fill="white" stroke="#172c4c" stroke-width="3"/><text x="59" y="111">O</text><path d="M80,165 v20 M80,175 H440 M440,165 v20" fill="none" stroke="#64748b"/><text x="260" y="203" text-anchor="middle">${q.skill==='conversion'?q.mm+' mm':q.d+' m'}</text></g></svg>`;return base+`<path d="M80,130 l-15,25 h30 Z M520,130 l-15,20 h30 Z" fill="none" stroke="#172c4c" stroke-width="2"/><circle cx="512" cy="155" r="4" fill="none" stroke="#172c4c"/><circle cx="528" cy="155" r="4" fill="none" stroke="#172c4c"/><text x="52" y="119">A</text><text x="540" y="119">B</text><path d="M80,178 v15 M80,186 H520 M${x},178 v15 M520,178 v15" fill="none" stroke="#64748b"/><text x="${(80+x)/2}" y="210" text-anchor="middle">a = ${q.a} m</text><text x="${(520+x)/2}" y="210" text-anchor="middle">b = ${q.b} m</text><text x="300" y="238" text-anchor="middle">전체 L = ${q.L} m · 보의 무게 무시</text></g></svg>`}
function skillStats(id){let r=ensureLearning().records.filter(r=>r.skill===id),first=r.filter(r=>r.first),recent=first.slice(-3),good=recent.filter(r=>r.independent).length,dates=new Set(recent.filter(r=>r.independent).map(r=>r.date));let status=!first.length?'미진단':recent.some(r=>!r.correct)?'집중 보완':good===3&&dates.size>=2?'확인 완료':good>=2?'강점 후보 · 지연 복습 필요':'연습 중';let last=r.at(-1),due=last?addDays(last.date,status==='확인 완료'?7:1):null;return {r,first,recent,status,due,good}}
function chooseSkill(){let l=ensureLearning(),last=l.records.at(-1),recent=l.records.filter(r=>r.first),tail=recent.slice(-2);if(last&&!last.independent&&!(tail.length===2&&tail.every(r=>r.skill===last.skill)))return last.skill;let missing=SKILLS.find(s=>!skillStats(s.id).first.length);if(missing)return missing.id;let due=SKILLS.filter(s=>skillStats(s.id).due<=today());let ranked=(due.length?due:SKILLS).map(s=>({id:s.id,st:skillStats(s.id)})).sort((a,b)=>a.st.good-b.st.good||a.st.first.length-b.st.first.length);return ranked.find(s=>!(tail.length===2&&tail.every(r=>r.skill===s.id)))?.id||ranked[0].id}
function beginConcept(){let l=ensureLearning();if(!l.current){let skill=chooseSkill();l.current={id:uid(),skill,n:l.sequence++,tries:0,hints:0,revealed:false,solved:false,last:null,draft:{answer:'',expression:'',unit:'',reason:'',confidence:'확신'}};save()}tab='drill';render()}
function judge(q,d){let number=Number(d.answer),math=parseMath(d.expression);if(!String(d.answer).trim()||!Number.isFinite(number))throw Error('답을 숫자로 입력하세요.');if(!math.operation)throw Error('답 숫자만 쓰지 말고 계산 과정을 수식으로 입력하세요.');if(!d.unit||!d.reason)throw Error('단위와 사용한 원리를 선택하세요.');let near=(a,b)=>Math.abs(a-b)<=0.005;let error='';if(d.reason!==q.reason)error='개념·기준점 선택';else if(d.unit!==q.unit)error='단위 실수';else if(!near(math.value,q.answer)){if(q.skill==='conversion')error='단위 환산·공식 확인';else if(['reaction','equation'].includes(q.skill))error='거리·공식 선택';else error='공식·조건 확인'}else if(!near(number,math.value))error='계산·답 입력';return {correct:!error,error,computed:math.value}}
const PRINCIPLES=[['vertical','위·아래 힘의 합을 같게 놓는다'],['atB','B점 기준으로 반력과 하중의 모멘트를 같게 놓는다'],['atA','A점 기준으로 반력과 하중의 모멘트를 같게 놓는다'],['turn','힘에 수직거리를 곱한다'],['convert','길이를 m로 환산한 뒤 힘을 곱한다']];
function conceptReport(){let l=ensureLearning();return '\n개념학습 (규칙 기반·직접 제작 연습문제):\n'+SKILLS.map(s=>{let st=skillStats(s.id);return `${s.name}: ${st.status} / 처음 제출 ${st.first.length}문제 / 최근 독립 정답 ${st.good}개 / 복습 ${st.due||'미정'}`}).join('\n')+'\n최근 보완 기록:\n'+(l.records.filter(r=>!r.correct).slice(-5).map(r=>`${r.date} ${SKILLS.find(s=>s.id===r.skill).name}: ${r.error}; 답 ${r.input}, 식 ${r.expression}`).join('\n')||'없음')}
function renderConcept(){let l=ensureLearning(),c=l.current,q=c?makeQuestion(c.skill,c.n):null,s=c?SKILLS.find(s=>s.id===c.skill):null;return `<section class="hero"><h2>한 문제씩, 근거까지 확인합니다.</h2><p class="muted">건축구조 기초 5개 영역 · 직접 만든 연습문제 · 실제 기출 아님</p><p class="muted">AI 연결 없이 정해진 규칙으로 진단합니다. 자유 서술·임의의 방정식은 해석하지 않으며, 수식 값과 선택한 원리를 확인합니다.</p>${!c?button('개념학습 시작','conceptBegin','','primary'):button('학습 마무리·요약','conceptEnd')}</section>${c?`<section class="panel"><span class="pill">${s.name} · ${c.tries?'재풀이':'첫 풀이'} · 힌트 ${c.hints}회</span><h2 style="margin-top:15px">${esc(q.prompt)}</h2>${diagram(q)}${c.hints||c.revealed?`<div class="note"><strong>핵심 개념</strong><p>${s.core}</p><p>${s.detail}</p><p>${s.contrast}</p><strong>힌트: ${q.hint}</strong></div>`:''}${c.revealed?`<div class="note"><strong>해설</strong><p>조건: ${['moment','conversion'].includes(q.skill)?'힘 '+q.F+'kN, 거리 '+(q.skill==='moment'?q.d+'m':q.mm+'mm'):'하중 '+q.P+'kN, a='+q.a+'m, b='+q.b+'m'} → 구할 값: ${q.unit==='kN'?'수직 반력':'모멘트 크기'}</p><p>공식 선택: ${s.formula}</p><p>단위: ${q.unit==='kN'?'힘 kN, 길이 m로 통일':'힘 kN, 길이 m로 통일'}</p><p>대입·계산: ${q.expression} = <b>${+q.answer.toFixed(3)} ${q.unit}</b></p><p>검산: ${q.unit==='kN'?`다른 반력과 합하면 ${q.P}kN이며, 하중에 가까운 받침이 더 많이 받습니다.`:'힘과 거리가 모두 양수이므로 모멘트 크기는 양수입니다. 거리를 두 배로 하면 크기도 두 배입니다.'}</p></div>`:''}${c.last?`<p class="${c.solved?'success':'warn'}">${esc(c.last)}</p>`:''}<form id="conceptForm"><label>계산식 (변수·등호·단위 없이 숫자로)<input name="expression" maxlength="180" required placeholder="예: 18 / 2 또는 12 * 4 / (2 + 4)" value="${esc(c.draft.expression)}" ${c.solved?'disabled':''}></label><small>×, x, *, ÷, /, +, −, 괄호 허용. 수식 값이 같다는 것만으로 풀이 원리가 증명되지는 않습니다.</small><div class="grid2"><label>답 (소수 셋째 자리까지 가능)<input name="answer" required inputmode="decimal" value="${esc(c.draft.answer)}" ${c.solved?'disabled':''}></label><label>단위<select name="unit" required ${c.solved?'disabled':''}><option value="">선택</option>${['kN','kN·m','m','mm'].map(u=>`<option ${c.draft.unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div><label>사용한 원리<select name="reason" required ${c.solved?'disabled':''}><option value="">선택</option>${PRINCIPLES.map(([v,t])=>`<option value="${v}" ${c.draft.reason===v?'selected':''}>${t}</option>`).join('')}</select></label><label>확신 정도<select name="confidence" ${c.solved?'disabled':''}><option ${c.draft.confidence==='확신'?'selected':''}>확신</option><option ${c.draft.confidence==='추측'?'selected':''}>추측</option></select></label><div class="actions">${!c.solved?'<button type="submit" class="primary">답과 수식 제출</button>':''}${button('힌트·개념 보기','conceptHint')}${button('정답·전체 해설','conceptExplain')}${c.solved||c.revealed?button('다음 맞춤 문제','conceptNext','','primary'):''}</div></form></section>`:`<div class="empty">${l.records.length?'이전 기록을 바탕으로 다음 문제를 선택합니다.':'아직 개념학습 기록이 없습니다. 시작하면 기초부터 한 문제씩 진단합니다.'}</div>`}<section class="panel" style="margin-top:20px"><h2>이해도 점검</h2><p class="muted">처음 제출한 문제만 평가합니다. 최근 3문제 모두 힌트 없이, 원리·수식·단위를 맞히고 ‘확신’으로 답했으며 2개 이상의 한국 날짜에 걸쳐 확인되면 ‘확인 완료’입니다. 당일 반복 정답은 강점 후보까지만 표시합니다. 공식 점수·합격 예측이 아닙니다.</p>${SKILLS.map(s=>{let st=skillStats(s.id);return `<div class="unit row between"><div><strong>${s.name}</strong><p class="muted">첫 제출 ${st.first.length}문제 · 최근 독립 정답 ${st.good}/3 ${st.due?'· 다음 복습 '+st.due:''}</p></div><span class="pill">${st.status}</span></div>`}).join('')}<p class="muted">보충 규칙: 오답·추측·힌트 사용 영역을 우선하되 같은 영역 연속 2문제 뒤에는 다른 영역을 점검합니다. 이후 복습일이 된 영역과 독립 정답이 적은 영역부터 출제합니다.</p></section><section class="panel" style="margin-top:20px"><h2>최근 오답과 재풀이</h2>${l.records.filter(r=>!r.correct).slice(-5).reverse().map(r=>{let later=l.records.find(x=>x.questionId===r.questionId&&x.correct);return `<div class="unit"><strong>${SKILLS.find(s=>s.id===r.skill).name} · ${esc(r.error)}</strong><p>${r.date} · 내 답: ${esc(r.input)} ${esc(r.unit)} · 식: ${esc(r.expression)}</p><p>${later?'같은 문제 재풀이 정답 · 독립 숙달로 계산하지 않음':'재풀이 정답 미확인'} · 기억할 핵심: ${SKILLS.find(s=>s.id===r.skill).core}</p></div>`}).join('')||'<p>아직 오답 기록이 없습니다.</p>'}</section>`}
const previousReport=report;report=function(){return previousReport()+conceptReport()};

document.addEventListener('submit',e=>{if(e.target.id!=='conceptForm')return;e.preventDefault();let l=ensureLearning(),c=l.current;if(!c||c.solved)return;let d=Object.fromEntries(new FormData(e.target).entries());c.draft=d;let q=makeQuestion(c.skill,c.n);try{let j=judge(q,d),first=c.tries===0,independent=j.correct&&first&&c.hints===0&&!c.revealed&&d.confidence==='확신';l.records.push({id:uid(),questionId:c.id,sequence:c.n,skill:c.skill,at:new Date().toISOString(),date:today(),first,correct:j.correct,independent,error:j.error,input:d.answer,expression:d.expression,unit:d.unit,reason:d.reason,confidence:d.confidence,hints:c.hints});c.tries++;c.solved=j.correct;c.last=j.correct?(independent?'정답입니다. 수식·단위·원리 선택까지 확인했습니다. 다른 조건과 지연 복습으로 다시 점검합니다.':'정답입니다. 힌트·추측·재풀이가 포함되어 독립 숙달로 처리하지 않습니다.'):j.error+'에서 확인이 필요합니다. 답을 바로 공개하지 않겠습니다. 힌트를 보고 다시 풀거나 전체 해설을 선택하세요.';save();render()}catch(err){toast(err.message)}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,l=ensureLearning(),c=l.current;if(a==='conceptBegin')beginConcept();if(a==='conceptHint'&&c){c.hints++;save();render()}if(a==='conceptExplain'&&c){c.revealed=true;c.hints++;if(!c.tries){l.records.push({id:uid(),questionId:c.id,sequence:c.n,skill:c.skill,at:new Date().toISOString(),date:today(),first:true,correct:false,independent:false,error:'해설 먼저 확인',input:c.draft.answer,expression:c.draft.expression,unit:c.draft.unit,reason:c.draft.reason,confidence:c.draft.confidence,hints:c.hints});c.tries++}save();render()}if(a==='conceptNext'&&c&&(c.solved||c.revealed)){l.current=null;beginConcept()}if(a==='conceptEnd'){let records=l.records.filter(r=>r.date===today()),weak=SKILLS.filter(s=>skillStats(s.id).status==='집중 보완');open(`<h2>오늘 개념학습 요약</h2><p>완료: ${new Set(records.filter(r=>r.correct).map(r=>r.questionId)).size}문제 정답 확인 (재풀이 포함)</p><p>아직 확인할 부분: ${weak.map(s=>s.name).join(', ')||'독립 풀이와 지연 복습'}</p><p>다음 복습: ${SKILLS.filter(s=>skillStats(s.id).first.length).map(s=>s.name+' '+skillStats(s.id).due).join(' / ')||'첫 진단 문제'}</p><p>다음 첫 과제: ${l.current&&!l.current.solved?'진행 중 문제 이어서 풀기':SKILLS.find(s=>s.id===chooseSkill()).name+' 1문제'}</p><p class="muted">진행 중 답과 수식은 저장됩니다. 과제 완료·수동 단원 상태는 자동 변경하지 않습니다.</p>${button('닫기','close')}`)}});

let catalogSubject='',catalogSearch='',activeLesson='';
function ensureCurriculum(){return state.curriculum||(state.curriculum={version:1,records:[],current:null})}
function validateCurriculum(c){assert(c&&c.version===1&&Array.isArray(c.records),'개념 기록 형식 오류');let ids=new Set();c.records.forEach(r=>{assert(r&&typeof r.id==='string'&&!ids.has(r.id)&&typeof r.lesson==='string'&&Number.isInteger(r.variant)&&r.variant>=0&&r.variant<2&&Number.isInteger(r.selected)&&r.selected>=0&&r.selected<3&&typeof r.correct==='boolean'&&typeof r.independent==='boolean'&&typeof r.hinted==='boolean'&&['확신','추측'].includes(r.confidence)&&validDate(r.date)&&typeof r.at==='string'&&!isNaN(Date.parse(r.at)),'개념 응답 기록 오류');assert(CURRICULUM.lessons.some(l=>l.id===r.lesson),'알 수 없는 개념 기록');assert(!r.independent||(r.correct&&!r.hinted&&r.confidence==='확신'),'숙달 기록 불일치');ids.add(r.id)});if(c.current!==null)assert(c.current&&typeof c.current.lesson==='string'&&Number.isInteger(c.current.variant)&&c.current.variant>=0&&c.current.variant<2&&typeof c.current.hinted==='boolean'&&typeof c.current.done==='boolean','진행 중 개념 오류')}
function lessonStats(id){let all=ensureCurriculum().records.filter(r=>r.lesson===id),recent=all.slice(-3),good=recent.filter(r=>r.independent),status=!all.length?'아직 확인 전':recent.some(r=>!r.correct)?'집중 보완':good.length>=3&&new Set(good.map(r=>r.date)).size>=2&&new Set(good.map(r=>r.variant)).size>=2?'기초 확인 완료':good.length>=2?'강점 후보 · 지연복습 필요':'학습 중';return {all,status,due:all.length?addDays(all.at(-1).date,status==='기초 확인 완료'?7:1):null}}
function nextLesson(){let c=ensureCurriculum(),tail=c.records.slice(-2),eligible=CURRICULUM.lessons.filter(l=>!(tail.length===2&&tail.every(r=>r.lesson===l.id)));let weak=eligible.find(l=>lessonStats(l.id).all.length&&lessonStats(l.id).status==='집중 보완');if(weak){let pre=weak.prerequisites.find(id=>lessonStats(id).status==='집중 보완'||!lessonStats(id).all.length);return pre||weak.id}return eligible.find(l=>lessonStats(l.id).due&&lessonStats(l.id).due<=today())?.id||eligible.find(l=>!lessonStats(l.id).all.length)?.id||eligible[0].id}
function openLesson(id){if(!CURRICULUM.lessons.some(l=>l.id===id))return;activeLesson=id;tab='concept';render()}
function startCheck(id){let c=ensureCurriculum(),last=lessonStats(id).all.at(-1);c.current={lesson:id,variant:last?1-last.variant:0,hinted:false,done:false};save();openLesson(id)}
function renderCurriculum(){let c=ensureCurriculum();let l=CURRICULUM.lessons.find(l=>l.id===activeLesson);if(l)return renderLesson(l);let filtered=CURRICULUM.lessons.filter(l=>{let s=CURRICULUM.scopes.find(s=>s.id===l.scopeId);return (!catalogSubject||s.subject===catalogSubject)&&(!catalogSearch||(l.title+' '+l.core+' '+s.name).includes(catalogSearch))});return `<section class="hero"><div class="eyebrow">2027—2031 · 필기 출제범위</div><h2>오늘은 한 개념을 설명하고 확인하세요.</h2><p>4과목 · 주요항목 21개 · 기초 학습카드 ${CURRICULUM.lessons.length}개. 문제은행과 분리된 직접 제작 확인문제입니다.</p><div class="actions">${button('추천 개념 시작','catalogNext','','primary')}${c.current?button('이어서 확인','catalogOpen',c.current.lesson):''}${button('수식으로 구조 계산 훈련','conceptBegin')}</div></section><div class="note">${CURRICULUM.notice}<br>열람은 숙달로 처리하지 않습니다. 판정은 저장된 답변과 확신 정도를 사용한 규칙 기반 추정입니다. 자유 서술의 의미를 AI가 채점하지 않습니다.</div><section class="panel"><div class="grid2"><label>과목<select id="catalogSubject"><option value="">전체 과목</option>${CURRICULUM.subjects.map(s=>`<option ${catalogSubject===s?'selected':''}>${s}</option>`).join('')}</select></label><form id="catalogSearch"><label>개념 찾기<input name="search" value="${esc(catalogSearch)}" placeholder="예: 반력, 전류, 공정"></label><button type="submit">검색</button></form></div>${!c.records.length?'<p>아직 기록이 없습니다. 추천 개념을 읽고 확인문제에 답해 주세요.</p>':`<p>개념 응답 ${c.records.length}회 · 기초 확인 완료 ${CURRICULUM.lessons.filter(l=>lessonStats(l.id).status==='기초 확인 완료').length}개. 전체 시험 숙달률이 아닙니다.</p>`}<div class="grid2">${filtered.map(l=>{let st=lessonStats(l.id),s=CURRICULUM.scopes.find(s=>s.id===l.scopeId);return `<article class="panel"><span class="pill">${esc(s.subject)}</span><h3>${esc(l.title)}</h3><p>${esc(l.core)}</p><p class="muted">약 ${l.minutes}분 · ${st.status}${st.due?' · 복습 '+st.due:''}</p>${button('개념 열기','catalogOpen',l.id)}</article>`}).join('')||'<p>검색 결과가 없습니다.</p>'}</div></section><details class="panel"><summary>전체 출제범위 지도 · 준비 상태 확인</summary><p>아래 설명 준비 개수는 해당 주요항목의 일부 기초 개념 수입니다. 범위 전체를 학습했다는 뜻이 아 function renderLesson(l){let c=ensureCurriculum(),s=CURRICULUM.scopes.find(s=>s.id===l.scopeId),cur=c.current?.lesson===l.id?c.current:null,q=cur?l.questions[cur.variant]:null,st=lessonStats(l.id),last=st.all.at(-1);return `${button('← 전체 개념','catalogBack')}<section class="hero"><div class="eyebrow">${s.subject} / ${s.name}</div><h2>${l.title}</h2><p>${st.status} · 약 ${l.minutes}분</p></section><section class="panel"><h3>① 핵심 한 문장</h3><p>${l.core}</p><h3>② 이해와 적용</h3><p>${l.explain}</p>${l.id==='reaction27'?diagram({skill:'reaction',P:12,a:2,b:4,L:6}):''}<h3>③ 헷갈리는 점</h3><p>${l.contrast}</p>${l.prerequisites.length?`<p>앞서 확인할 개념: ${l.prerequisites.map(id=>button(CURRICULUM.lessons.find(x=>x.id===id).title,'catalogOpen',id)).join(' ')}</p>`:''}<p class="muted">${l.sourceIds.map(id=>{let src=CURRICULUM.sources.find(x=>x.id===id);return `<a href="${src.url}" target="_blank" rel="noopener">${src.title}</a> · ${src.note}`}).join('<br>')}</p>${!cur?button('④ 이해 확인 시작','catalogCheck',l.id,'primary'):''}</section>${cur?`<section class="panel"><span class="pill">직접 제작 개념 확인 · 실제 기출 아님</span><h3>${esc(q.prompt)}</h3>${!cur.done?`<form id="catalogAnswer"><label>답<select name="answer" required><option value="">선택하세요</option>${q.choices.map((x,i)=>`<option value="${i}">${i+1}. ${esc(x)}</option>`).join('')}</select></label><label>확신 정도<select name="confidence"><option>확신</option><option>추측</option></select></label><div class="actions"><button class="primary" type="submit">답 제출</button>${button('핵심 다시 보기 · 도움 기록','catalogHint')}${button('정답과 해설 보기','catalogReveal')}</div></form>${cur.hinted?`<div class="note">힌트: ${l.core}<br>${l.contrast}</div>`:''}`:`<div class="note"><strong>${last?.correct?'정답입니다.':'다시 확인할 개념입니다.'}</strong><p>정답: ${q.answer+1}. ${q.choices[q.answer]}</p><p>${q.explanation}</p><p>${last?.independent?'다른 조건과 날짜에서도 확인해야 강점으로 판단합니다.':'도움·추측·오답 기록은 독립 숙달로 계산하지 않습니다.'}</p></div><div class="actions">${button('조건을 바꿔 확인','catalogCheck',l.id)}${button('다음 추천 개념','catalogNext','','primary')}</div>`}</section>`:''}<section class="panel"><h3>복습 기록</h3><p>다음 복습: ${st.due||'첫 응답 후 설정'}</p>${st.all.slice(-5).reverse().map(r=>`<p>${r.date} · 확인 ${r.variant+1} · ${r.correct?'정답':'보완 필요'} · ${r.confidence} · ${r.hinted?'도움 사용':'도움 표시 없음'}</p>`).join('')||'<p>아직 기록이 없습니다.</p>'}<p class="muted">최근 3회 모두 도움 없이 확신 정답, 2종류 확인과 2일 이상의 한국 날짜가 충족되면 ‘기초 확인 완료’로 표시합니다. 같은 문항 재노출이므로 새로운 문제에 적용할 수 있는지는 이후 문제은행으로 추가 검증해야 합니다.</p></section>`}
function recordCatalog(selected,confidence,revealed=false){let c=ensureCurriculum(),cur=c.current;if(!cur||cur.done)return;let l=CURRICULUM.lessons.find(l=>l.id===cur.lesson);if(!l)return;let q=l.questions[cur.variant],correct=!revealed&&selected===q.answer;c.records.push({id:uid(),lesson:l.id,variant:cur.variant,selected:revealed?q.answer:selected,correct,independent:correct&&!cur.hinted&&confidence==='확신',hinted:cur.hinted||revealed,confidence,date:today(),at:new Date().toISOString()});cur.done=true;save();render()}
document.addEventListener('change',e=>{if(e.target.id==='catalogSubject'){catalogSubject=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='catalogSearch'){e.preventDefault();catalogSearch=new FormData(e.target).get('search').trim();render()}if(e.target.id==='catalogAnswer'){e.preventDefault();let f=new FormData(e.target);recordCatalog(Number(f.get('answer')),f.get('confidence'))}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='catalogOpen')openLesson(id);if(a==='catalogCheck')startCheck(id);if(a==='catalogNext')openLesson(nextLesson());if(a==='catalogBack'){activeLesson='';render()}if(a==='catalogHint'){let c=ensureCurriculum().current;if(c&&!c.done){c.hinted=true;save();render()}}if(a==='catalogReveal')recordCatalog(0,'추측',true)});
const reportBeforeCurriculum=report;report=function(){return reportBeforeCurriculum()+'\n2027~2031 개념학습(규칙 기반 추정):\n'+CURRICULUM.lessons.filter(l=>lessonStats(l.id).all.length).map(l=>l.title+': '+lessonStats(l.id).status+' / 복습 '+lessonStats(l.id).due).join('\n')+'\n다음 추천: '+CURRICULUM.lessons.find(l=>l.id===nextLesson()).title};
const todayBeforeCurriculum=renderToday;renderToday=function(){return `<section class="panel"><span class="pill">2027~2031 출제범위</span><h2>기초 개념부터 한 단계씩</h2><p>추천: ${CURRICULUM.lessons.find(l=>l.id===nextLesson()).title}</p>${button('오늘 개념학습 시작','catalogNext','','primary')}<p class="muted">기존 과제의 과목명·단원·완료 기록은 보존됩니다. 새 공식 범위는 개념 데이터베이스의 4과목 분류로 제공합니다.</p></section>`+todayBeforeCurriculum()};

const progressV3=renderProgress;
renderProgress=function(){let lessons=CURRICULUM.lessons, practiced=lessons.filter(l=>lessonStats(l.id).all.length), weak=lessons.filter(l=>lessonStats(l.id).status==='집중 보완'), due=lessons.filter(l=>lessonStats(l.id).due&&lessonStats(l.id).due<=today()), ready=lessons.filter(l=>lessonStats(l.id).status==='기초 확인 완료');return '<div class="cards"><div class="card"><span>학습한 기초 개념</span><strong>'+practiced.length+' / '+lessons.length+'</strong><small>전체 출제범위 완료율이 아닙니다</small></div><div class="card"><span>지금 보완할 개념</span><strong>'+weak.length+'개</strong><small>최근 답변에 오답 포함</small></div><div class="card"><span>복습할 개념</span><strong>'+due.length+'개</strong><small>한국 날짜 기준 복습 도래</small></div></div><section class="panel"><h2>과목별 내 학습현황</h2>'+CURRICULUM.subjects.map(s=>{let ls=lessons.filter(l=>CURRICULUM.scopes.find(x=>x.id===l.scopeId).subject===s),n=ls.filter(l=>lessonStats(l.id).all.length).length;return '<div class="unit"><div class="row between"><strong>'+s+'</strong><span>'+n+' / '+ls.length+'개 시작</span></div><div class="bar"><i style="width:'+(ls.length?100*n/ls.length:0)+'%"></i></div><small>기초 확인 완료 '+ls.filter(l=>lessonStats(l.id).status==='기초 확인 완료').length+'개 · 준비된 개념만 집계</small></div>'}).join('')+'</section><div class="grid2"><section class="panel"><h2>약점 집중 학습</h2>'+(weak.map(l=>'<div class="unit">'+button(l.title,'catalogOpen',l.id)+'<p>'+lessonStats(l.id).status+'</p></div>').join('')||'<p>아직 확인된 약점이 없습니다. 진단 답변을 쌓아 주세요.</p>')+'</section><section class="panel"><h2>오늘 복습</h2>'+(due.map(l=>'<div class="unit">'+button(l.title,'catalogOpen',l.id)+'<p>복습 예정 '+lessonStats(l.id).due+'</p></div>').join('')||'<p>예정된 복습이 없습니다.</p>')+'</section></div><section class="panel"><h2>구조 계산 훈련</h2>'+SKILLS.map(s=>'<div class="unit row between"><span>'+s.name+'</span><span class="pill">'+skillStats(s.id).status+'</span></div>').join('')+button('계산 훈련 시작','conceptBegin','','primary')+'</section><details class="panel"><summary>과제·수동 단원·문제은행 기록</summary>'+progressV3()+'</details>'};
function renderChanges(){return '<section class="hero"><span class="pill">2027.01.01 ~ 2031.12.31</span><h2>4과목 체계로 학습합니다.</h2><p>법규는 없어지는 것이 아니라 건축계획 및 설계의 학습범위에 포함됩니다.</p></section><section class="panel"><h2>시험 구성 변경</h2><div class="table-scroll"><table><thead><tr><th>구분</th><th>기존 체계</th><th>2027년 체계</th></tr></thead><tbody><tr><td>필기 과목</td><td>5과목</td><td>4과목</td></tr><tr><td>계획 과목</td><td>건축계획</td><td>건축계획 및 설계</td></tr><tr><td>법규</td><td>건축관계법규 별도</td><td>계획 및 설계 범위에서 학습</td></tr><tr><td>문항 / 시간</td><td>100문항 / 150분</td><td>80문항 / 120분</td></tr></tbody></table></div><p class="muted">사용자 제공 공식 출제기준 PDF(필기 1~9쪽) 및 큐넷 안내 기준. 실제 응시 회차 공고도 확인하세요.</p><a href="https://www.q-net.or.kr/crf005.do?id=crf00503s02&jmCd=1630" target="_blank" rel="noopener">큐넷 공식 출제기준 확인 ↗</a></section><section class="panel"><h2>중점적으로 학습할 부분</h2><p class="muted">아래는 출제빈도 예측이 아닌 선행 개념과 개정 범위를 고려한 학습 제안입니다.</p><div class="unit"><h3>01 구조 — 수식의 근거부터</h3><p>힘·단위 → 모멘트 → 평형·반력 → 응력·단면 성질. 숫자만 맞히지 말고 기준점과 거리를 설명하는 연습을 합니다.</p></div><div class="unit"><h3>02 계획 및 설계 — 도면과 법규 연결</h3><p>공간 계획, 도면 해석, 건축법령·관계법령을 함께 봅니다. 2024 교재의 법규 수치는 적용 시점 확인 후 사용합니다.</p></div><div class="unit"><h3>03 시공 — 현장 경험을 시험 용어로</h3><p>공정·적산·가설·기초·구조체·마감의 순서와 공법 선택 이유를 정리합니다. 철거현장 경험만으로 다른 공종까지 숙달했다고 판단하지 않습니다.</p></div><div class="unit"><h3>04 설비 — 원리와 계통 구분</h3><p>열·공기·급배수 기초에서 전기이론, 건축전기, 소방시설로 확장합니다. 명시된 항목이라는 이유만으로 모두 새로 추가된 내용이라고 보지는 않습니다.</p></div></section><section class="panel"><h2>2024년 교재 사용법</h2><p>구조의 기본 원리와 시공 개념은 필요한 부분만 참고합니다. 법규·설계 수치·범위 차이를 확인해야 할 때 해당 단원을 요청하겠습니다.</p><p>현재 앱은 20개 기초 개념과 40개 자체 확인문항을 제공합니다. 전체 범위 해설과 기출 문제은행은 아직 준비 중입니다.</p></section>'}
const todayV3=renderToday;
renderToday=function(){let next=CURRICULUM.lessons.find(l=>l.id===nextLesson()),current=ensureCurriculum().current;return '<section class="hero"><div class="eyebrow">오늘의 한 단계</div><h2>'+esc(next.title)+'</h2><p>약 '+next.minutes+'분 · 개념 읽기 → 이해 확인 → 약점 복습</p><div class="actions">'+button(current&&!current.done?'이어서 학습하기':'오늘 학습 시작',current&&!current.done?'catalogOpen':'catalogNext',current?.lesson||'','primary')+button('내 학습현황','tab','progress')+'</div></section><div class="grid2"><section class="panel"><h3>퇴근 후 작은 학습 루틴</h3><p>개념 한 개를 이해하고, 답의 근거를 확인하세요. 시간이 부족한 날은 한 개념만 마쳐도 됩니다.</p>'+button('학습실 열기','tab','concept')+'</section><section class="panel"><h3>2027년 시험에 맞춰 준비</h3><p>4과목 구성과 법규 학습 위치를 확인하세요.</p>'+button('변경사항과 학습 우선순위','tab','changes')+'</section></div><details class="panel"><summary>오늘 과제 관리</summary>'+todayBeforeCurriculum()+'</details>'};


renderToday=function(){let lessons=CURRICULUM.lessons,next=lessons.find(l=>l.id===nextLesson()),c=ensureCurriculum().current,weak=lessons.filter(l=>lessonStats(l.id).status==='집중 보완'),due=lessons.filter(l=>lessonStats(l.id).due&&lessonStats(l.id).due<=today()),tasks=tasksFor(today()),done=tasks.filter(t=>t.status==='완료').length;return '<div class="overview"><section class="panel"><div class="row between"><h2>나의 학습 흐름</h2>'+button('자세히 보기','tab','progress')+'</div><div class="rings">'+CURRICULUM.subjects.map((s,i)=>{let ls=lessons.filter(l=>CURRICULUM.scopes.find(x=>x.id===l.scopeId).subject===s),n=ls.filter(l=>lessonStats(l.id).all.length).length,p=ls.length?Math.round(n/ls.length*100):0;return '<div class="ring-item"><div class="ring" style="--value:'+p+';--ring-color:'+['#d6b847','#8872d8','#58bca0','#74a6df'][i]+'"><b>'+p+'%</b></div><strong>'+s+'</strong><p class="muted">'+n+' / '+ls.length+'개 시작</p></div>'}).join('')+'</div><small>준비된 기초 개념의 학습 시작 비율입니다. 시험 숙달률이 아닙니다.</small></section><section class="hero"><div class="eyebrow">TODAY’S STUDY</div><h2>오늘은 이 개념부터</h2><p>'+esc(c&&!c.done?lessons.find(l=>l.id===c.lesson).title:next.title)+'</p><p class="muted">짧게 이해하고, 한 문제로 확인하세요.</p>'+button(c&&!c.done?'이어서 공부하기':'학습 시작',c&&!c.done?'catalogOpen':'catalogNext',c?.lesson||'','primary')+'</section></div><div class="overview"><section class="panel"><h2>다음 할 일</h2><div class="mini-list"><div class="mini-line"><span>집중 보완할 개념</span><span class="pill">'+weak.length+'개</span></div><div class="mini-line"><span>복습할 개념</span><span class="pill">'+due.length+'개</span></div><div class="mini-line"><span>오늘 과제</span><span>'+done+' / '+tasks.length+'개 완료</span></div></div><div class="actions">'+button('내 학습현황','tab','progress')+button('과제 추가','add',today())+'</div></section><section class="panel"><div class="row between"><h2>이번 7일</h2>'+button('계획 보기','tab','week')+'</div><div class="week-strip">'+Array.from({length:7},(_,i)=>{let d=addDays(today(),i),n=tasksFor(d).length;return '<div class="date-cell '+(!i?'now':'')+'"><small>'+['일','월','화','수','목','금','토'][new Date(d+'T12:00:00+09:00').getUTCDay()]+'</small><b>'+Number(d.slice(-2))+'</b><i>'+n+'개</i></div>'}).join('')+'</div><p class="muted">'+today()+'부터 · 한국 시간 기준</p></section></div><section class="panel row between"><div><h3>2027년, 달라진 시험 준비</h3><span class="muted">4과목 구성과 학습 우선순위를 확인하세요.</span></div>'+button('변경 안내','tab','changes')+'</section><details class="panel"><summary>오늘 과제 목록</summary>'+todayBeforeCurriculum()+'</details>'};
render();
